---
# CI/CD workflow for raidr_agent_lib
# Runs typecheck, lint, tests and build; publishes @sudobility/raidr_agent_lib
# to npm (public) from main.

name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write # For creating GitHub releases
  id-token: write # For NPM provenance
  deployments: write # For deployment tracking

jobs:
  cicd:
    uses: johnqh/workflows/.github/workflows/unified-cicd.yml@main
    with:
      npm-access: "public"
    secrets: inherit
